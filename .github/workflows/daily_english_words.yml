name: Daily English Words

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  send-words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Daily English Words mailini gonder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO_LIST: ${{ secrets.MAIL_TO_LIST }}
        run: python daily_english_words.py
