name: Sabah Brifingi Maili

on:
  schedule:
    - cron: "55 5 * * *"  # Her gun 05:55 UTC = 08:55 Istanbul (tam saat basi yogunlugundan kacinmak icin 5 dk once)
  workflow_dispatch: {}

jobs:
  send-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Brifing mailini gonder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO_LIST: ${{ secrets.MAIL_TO_LIST || secrets.MAIL_TO }}
        run: python sabah_brifingi.py
